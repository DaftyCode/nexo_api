<div class="tools-page">
  @if (state.backSection(); as previous) {
    <button type="button" class="text-button back-button" (click)="state.goBack()">
      <span aria-hidden="true">←</span> {{ 'Back to' | transloco }}
      {{ sectionLabel(previous) | transloco }}
    </button>
  }
  @switch (section()) {
    @case ('environments') {
      <app-environment-panel />
    }
    @case ('collection-settings') {
      <app-collection-settings-panel />
    }
    @case ('runner') {
      <app-runner-panel />
    }
    @case ('realtime') {
      <app-protocol-panel />
    }
    @case ('mocks') {
      <app-data-panel section="mocks" />
    }
    @case ('datasets') {
      <app-data-panel section="datasets" />
    }
    @case ('mongo') {
      <!-- Its own chunk, loaded when the section is opened. -->
      @defer (on immediate) {
        <app-mongo-panel />
      } @placeholder {
        <div class="spinner" role="status" [attr.aria-label]="'Loading' | transloco"></div>
      }
    }
    @default {
      <app-integration-panel [section]="section()" />
    }
  }
</div>
