# cargo-deny policy, checked in CI (.github/workflows/ci.yml).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Fail on vulnerabilities and on unmaintained or yanked crates reported by RustSec.
version = 2
yanked = "deny"
ignore = [
  # zbus 5 split crates, reached only through keyring on Linux (Secret Service). They are
  # unmaintained because zbus 6 merged them, not because of a vulnerability; keyring 4.2.0
  # (the latest) still uses zbus 5. Remove when keyring moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via keyring; merged into zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via keyring; merged into zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via keyring; merged into zbus 6" },
]

[licenses]
version = 2
# Licenses present in the dependency tree on 2026-11-04. Adding another license needs review.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
