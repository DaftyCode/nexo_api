# cargo-deny policy, checked in CI (.github/workflows/ci.yml).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Fail on vulnerabilities and on unmaintained or yanked crates reported by RustSec.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Licenses present in the dependency tree on 2026-11-04. Adding another license needs review.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
