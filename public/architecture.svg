<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title description">
  <title id="title">How Nexo API works</title>
  <desc id="description">The Angular interface and Tauri desktop connect to Rust. Rust coordinates the SQLite database, encrypted secrets and an auxiliary engine that runs requests and scripts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#a7b5ca" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .box { fill: #1b2432; stroke: #3c4c61; stroke-width: 1.5; }
      .native { fill: #30251f; stroke: #ff956b; stroke-width: 1.5; }
      .heading { fill: #f1f5fb; font-size: 19px; font-weight: 650; text-anchor: middle; }
      .detail { fill: #b7c4d6; font-size: 13px; text-anchor: middle; }
      .line { fill: none; stroke: #a7b5ca; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="430" rx="16" fill="#111822"/>
  <text x="30" y="37" fill="#ff956b" font-family="system-ui, sans-serif" font-size="13" font-weight="650" letter-spacing="2">NEXO API</text>
