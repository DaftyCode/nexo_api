[package]
name = "nexo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Request execution engine: HTTP, scripts, protocols, mocks, datasets and vault"
[dependencies]
nexo-domain = { path = "../nexo-domain" }
nexo-application = { path = "../nexo-application" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tracing.workspace = true
futures-util.workspace = true
base64.workspace = true
axum.workspace = true
rquickjs = { version = "0.14.0", default-features = false, features = ["classes", "properties"] }
cookie_store = "0.22.1"
encoding_rs = "0.8.44"
serde-saphyr = "2.1.1"
shell-words = "1.1.1"
url = "2.5.8"
csv = "1.4.0"
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "rustls-tls-native-roots"], default-features = false }
# Only the MQTT packet codec: transports and TLS are this crate's.
rumqttc = { version = "0.25.1", default-features = false }
# Every TLS client uses aws-lc-rs, the provider reqwest uses for HTTP, so all protocols
# offer the same post-quantum key exchange (X25519MLKEM768) and signature algorithms.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tonic = { version = "0.14.9", default-features = false, features = ["transport", "tls-aws-lc", "codegen", "tls-native-roots"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
tokio-util = "0.7.20"
bytes = "1.12.1"
http = "1.5.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
# Already built for TLS; also the vault (AES-256-GCM), hashes, randomness and request signing
# (HMAC, RSA, ECDSA): no other crypto crate.
aws-lc-rs = "1.19.0"
# The C library behind aws-lc-rs (already built): what legacy protocols need and aws-lc-rs
# does not offer: RSA-SHA1 (OAuth 1.0), MD4, MD5, HMAC-MD5 and DES (NTLM, Digest).
aws-lc-sys = "0.47.0"
rustls-native-certs = "0.8.5"
# Only the Kafka wire codec: connections, TLS, SASL and the egress policy are this crate's.
# `broker` adds no crates; with `client` it provides the generic request trait. gzip and
# snappy only: its lz4 and zstd features build C libraries.
kafka-protocol = { version = "0.18.0", default-features = false, features = ["client", "broker", "gzip", "snappy"] }
# Pure-Rust decoders for lz4 and zstd batches, which many Java producers send.
lz4_flex = { version = "0.14.0", default-features = false, features = ["frame", "safe-decode"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
indexmap = "2"
anyhow = "1"
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
