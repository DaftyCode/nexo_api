[package]
name = "nexo-driver-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "What a Nexo database driver and its host share: the protocol, typed values and the driver runtime"

[features]
# TLS settings for drivers that open their own connections: rustls on aws-lc-rs, Nexo's
# only provider, preferring post-quantum key exchange.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types"]
# The checks every driver runs against a real server.
conformance = []

[dependencies]
# No other Nexo crate: a driver is a separate process that only knows this protocol.
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
base64.workspace = true
# The versions the engine already uses (no new crates).
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
