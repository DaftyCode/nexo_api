[package]
name = "nexo-modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Database modules of Nexo: starts each driver process and talks to it"

[dependencies]
nexo-domain = { path = "../nexo-domain" }
nexo-application = { path = "../nexo-application" }
# The protocol and its client. Drivers themselves are never dependencies: they are separate
# executables, found on disk and started when a connection needs them.
nexo-driver-sdk = { path = "../nexo-driver-sdk" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Downloads of the modules: the HTTP client the engine uses (rustls on aws-lc-rs).
reqwest.workspace = true
# SHA-256 of the module files, with the provider every TLS connection of Nexo uses.
aws-lc-rs = "1.19.0"
# The release assets are compressed with gzip; already in the tree through Kafka.
flate2 = "1.1.11"
# The archives of llama.cpp for the local model (IA-01): zip on Windows, tar.gz elsewhere;
# both already in the tree (the files module and DuckDB).
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
tar = "0.4.46"

# The free RAM for the local model (IA-01), and the job that ends its engine with Nexo;
# already in the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# The signal that ends the engine of the local model with Nexo; already in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
