[package]
name = "nexo-driver-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SQLite databases, in a file of this computer that the person chose"

[package.metadata.nexo]
module = "sqlite"

[dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk" }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The SQLite the rest of the workspace uses (bundled, with its hooks: the authorizer and the
# progress handler), and the table and column each result column comes from.
rusqlite = { workspace = true, features = ["column_metadata"] }

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["conformance"] }
