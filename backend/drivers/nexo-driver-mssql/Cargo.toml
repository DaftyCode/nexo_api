[package]
name = "nexo-driver-mssql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Microsoft SQL Server and Azure SQL Database"

[package.metadata.nexo]
module = "mssql"

[dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["tls"] }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The TDS client. Its TLS is rustls with aws-lc-rs (it takes the installed provider, else
# aws-lc-rs); no native-tls, no Windows authentication (out of scope), no SQL Browser of its
# own (the driver asks the host for every address, also the browser's).
tiberius = { version = "=0.13.0", default-features = false, features = ["rustls", "tds73", "tds80", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
uuid.workspace = true
base64.workspace = true
futures-util.workspace = true
# Reads the messages (PRINT, RAISERROR under 11) tiberius only writes to its log.
tracing.workspace = true

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["tls", "conformance"] }
