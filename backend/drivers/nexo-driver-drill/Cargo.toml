[package]
name = "nexo-driver-drill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Apache Drill, through its REST API"

[package.metadata.nexo]
module = "drill"

[dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["http"] }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["conformance", "http"] }
