[package]
name = "nexo-driver-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "MySQL, MariaDB and the servers that speak their protocol"

[package.metadata.nexo]
module = "mysql"

[dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["tls"] }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The client of the MySQL protocol, with rustls on aws-lc-rs (the provider the SDK prefers:
# post-quantum key exchange first) and MariaDB's ed25519 authentication. It connects to the
# addresses the host resolved (`resolved_ips`), never resolving names itself.
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "tls12", "aws-lc-rs", "client_ed25519"] }
base64.workspace = true

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["tls", "conformance"] }
