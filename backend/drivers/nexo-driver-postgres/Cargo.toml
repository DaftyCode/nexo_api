[package]
name = "nexo-driver-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "PostgreSQL and the servers that speak its protocol (CockroachDB, YugabyteDB, TimescaleDB)"

[package.metadata.nexo]
module = "postgres"

[dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["tls"] }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The client of the PostgreSQL protocol, without its own sockets: the driver connects through
# the host's egress policy and hands it the stream (`connect_raw`).
tokio-postgres = { version = "0.7", default-features = false, features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
# TLS for it on rustls with the SDK's configuration (aws-lc-rs), through a connector of this
# crate: tokio-postgres-rustls depends on ring. Same versions as the engine (no new crates).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
# The binary forms of PostgreSQL's types, and what tokio-postgres uses (same versions).
postgres-protocol = "0.6.12"
fallible-iterator = "0.2.0"
bytes = "1.12.1"
uuid.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
base64.workspace = true
futures-util.workspace = true

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["tls", "conformance"] }
