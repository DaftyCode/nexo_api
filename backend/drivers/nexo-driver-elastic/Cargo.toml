base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes = "1.12.2"

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["conformance", "http"] }
