[package]
name = "nexo-driver-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Files as a database (CSV, JSON, Parquet, Excel) and DuckDB databases, read with DuckDB"

[package.metadata.nexo]
module = "files"

[dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk" }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# DuckDB compiled in, with its JSON and Parquet readers; without httpfs nor any extension
# loaded from the network (DB-30). Excel workbooks are read with calamine (pure Rust).
duckdb = { version = "~1.20001.0", default-features = false, features = ["bundled", "json", "parquet"] }
calamine = { version = "0.38.0", default-features = false }

[dev-dependencies]
nexo-driver-sdk = { path = "../../crates/nexo-driver-sdk", features = ["conformance"] }
# The tests write an Excel workbook by hand.
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
