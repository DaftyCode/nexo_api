version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
    ignore:
      # Each Angular release fixes the TypeScript it compiles with (Angular 22: >=6.0 <6.1),
      # so TypeScript moves when Angular does, not before.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The PostgreSQL driver reads arrays and hstore through the iterators of
      # postgres-protocol, which implement fallible-iterator 0.2 (still in 0.6.12): it moves
      # when postgres-protocol does, not before.
      - dependency-name: fallible-iterator
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
