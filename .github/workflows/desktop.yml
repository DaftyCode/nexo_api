name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            bundles: nsis,msi
          - name: macos-arm64
            runner: macos-15
            bundles: app,dmg
          - name: macos-intel
            runner: macos-15-intel
            bundles: app,dmg
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config rpm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/check-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run test:architecture
      - run: npm run test:packages
      - run: npm run test:bootstrap
      - run: npm run i18n:check
      - run: npm run engine:test
      - name: Build with the Windows bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1 -SkipSystemInstall -Bundles '${{ matrix.bundles }}'
      - name: Build with the macOS or Linux bootstrap
        if: runner.os != 'Windows'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
        run: bash build.sh --skip-system-install --bundles '${{ matrix.bundles }}'
      - name: Package for the Microsoft Store (MSIX)
        if: runner.os == 'Windows'
        env:
          # Product identity from Partner Center, kept as repository variables.
          NEXO_MSIX_NAME: ${{ vars.NEXO_MSIX_NAME }}
          NEXO_MSIX_PUBLISHER: ${{ vars.NEXO_MSIX_PUBLISHER }}
          NEXO_MSIX_PUBLISHER_NAME: ${{ vars.NEXO_MSIX_PUBLISHER_NAME }}
        run: node tools/package-msix.mjs --skip-build
      - name: Smoke test the installed package
        run: node tools/smoke-package.mjs
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/msix/*.msix
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexo-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/msix/*.msix
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir .verification/native
      - name: Generate package manager manifests and checksums
        run: |
          node tools/stage-release-assets.mjs .verification/native .verification/upload
          node tools/package-manifests.mjs --artifacts .verification/upload --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY"
      - name: Generate software bills of materials
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > .verification/upload/nexo-npm.cdx.json
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename nexo.cdx
          cp src-tauri/nexo.cdx.json .verification/upload/nexo-desktop.cdx.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > .verification/is-draft; then
            test "$(cat .verification/is-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Nexo API $GITHUB_REF_NAME" --notes "Native Windows, macOS and Linux packages. Review installers, checksums and signing before publishing."
          fi
          find .verification/upload -type f -print0 | xargs -0 -I{} gh release upload "$GITHUB_REF_NAME" "{}" --clobber
          zip -r .verification/package-manager-manifests.zip .verification/packages
          gh release upload "$GITHUB_REF_NAME" .verification/packages/SHA256SUMS .verification/package-manager-manifests.zip --clobber
