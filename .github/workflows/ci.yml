name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Angular and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:architecture
      - run: npm run i18n:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:packages
      - run: npm run test:bootstrap
      - run: npm run test:audit
      - run: npm run build
      - run: npm run build:desktop
      # High and critical advisories fail, except those of tools/audit-exceptions.json while
      # no release fixes them and before they expire.
      - name: Audit production dependencies
        run: npm run audit:check
      # A failed job stops the whole run: its result is known, so the other jobs need not
      # finish. A pull request from a fork has a read-only token and only fails here.
      - name: Stop the other jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || echo "The run could not be cancelled"

  rust:
    name: Rust backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --exclude nexo-desktop --exclude nexo-driver-files --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude nexo-desktop --exclude nexo-driver-files
      - name: Check advisories and licenses
        run: |
          cargo install cargo-deny --locked
          cargo deny --workspace --exclude nexo-desktop check advisories bans licenses sources
      # A failed job stops the whole run: its result is known, so the other jobs need not
      # finish. A pull request from a fork has a read-only token and only fails here.
      - name: Stop the other jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || echo "The run could not be cancelled"

  files:
    # The files driver compiles DuckDB (C++), which takes minutes: it has a job of its own.
    name: Files driver (DuckDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup show active-toolchain
      - run: npm ci --no-audit --no-fund
      - run: npm run files:test
      - name: The files module through Nexo
        run: |
          cargo build --locked -p nexo-server -p nexo-driver-files
          node --test tests/contract/db-files.test.mjs

  e2e:
    name: Engine contracts, local web service and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [web, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup show active-toolchain
      - run: npm ci --no-audit --no-fund
      - name: Start a Kafka broker (Redpanda) for the Kafka contract tests
        run: bash tools/kafka-fixture.sh start
      - name: Start MongoDB servers and FerretDB for the MongoDB contract and E2E tests
        run: bash tools/mongo-fixture.sh start
      - name: Start the PostgreSQL, SQL Server, MySQL and MariaDB servers for the database driver tests
        run: bash tools/sql-fixture.sh start
      - name: PostgreSQL driver against real servers
        run: node tools/cargo.mjs test --locked -p nexo-driver-postgres
      - name: SQL Server driver against a real server
        run: node tools/cargo.mjs test --locked -p nexo-driver-mssql
      - name: MySQL driver against MySQL and MariaDB
        run: node tools/cargo.mjs test --locked -p nexo-driver-mysql
      - name: Start Cassandra, Redis, Valkey, Elasticsearch, OpenSearch, Drill, Hive and Ignite for their driver and contract tests
        run: bash tools/nosql-fixture.sh start cassandra redis elastic drill hive ignite
      - name: Cassandra driver against a real node
        run: node tools/cargo.mjs test --locked -p nexo-driver-cassandra
      - name: Redis driver against Redis and Valkey
        run: node tools/cargo.mjs test --locked -p nexo-driver-redis
      - name: Elasticsearch driver against Elasticsearch and OpenSearch
        run: node tools/cargo.mjs test --locked -p nexo-driver-elastic
      - name: Drill driver against an embedded Drillbit
        run: node tools/cargo.mjs test --locked -p nexo-driver-drill
      - name: MongoDB driver against a real server
        run: node tools/cargo.mjs test --locked -p nexo-driver-mongodb
      - name: Hive driver against HiveServer2 in HTTP mode
        run: node tools/cargo.mjs test --locked -p nexo-driver-hive
      - name: Ignite driver against Ignite 3 nodes, open and with TLS and authentication
        run: node tools/cargo.mjs test --locked -p nexo-driver-ignite
      - run: npm run engine:test
      - name: Stop the Kafka broker
        if: always()
        run: bash tools/kafka-fixture.sh stop
      - run: npm run backend:build
      - run: npm run test:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The MongoDB explorer and database section E2E tests query the fixtures' data; the
      # drivers they download were built by engine:test.
      - run: npm run e2e
      - name: Stop the MongoDB servers
        if: always()
        run: bash tools/mongo-fixture.sh stop
      - name: Stop the SQL servers
        if: always()
        run: bash tools/sql-fixture.sh stop
      - name: Stop the NoSQL servers
        if: always()
        run: bash tools/nosql-fixture.sh stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
