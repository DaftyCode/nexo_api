name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Angular and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:architecture
      - run: npm run i18n:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:packages
      - run: npm run test:bootstrap
      - run: npm run build
      - run: npm run build:desktop
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --exclude nexo-desktop --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude nexo-desktop
      - name: Check advisories and licenses
        run: |
          cargo install cargo-deny --locked
          cargo deny --workspace --exclude nexo-desktop check advisories bans licenses sources

  e2e:
    name: Engine contracts, local web service and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [web, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup show active-toolchain
      - run: npm ci --no-audit --no-fund
      - name: Start a Kafka broker (Redpanda) for the Kafka contract tests
        run: bash tools/kafka-fixture.sh start
      - name: Start MongoDB servers and FerretDB for the MongoDB contract and E2E tests
        run: bash tools/mongo-fixture.sh start
      - name: Start PostgreSQL servers for the database driver tests
        run: bash tools/sql-fixture.sh start
      - name: PostgreSQL driver against real servers
        run: node tools/cargo.mjs test --locked -p nexo-driver-postgres
      - run: npm run engine:test
      - name: Stop the Kafka broker
        if: always()
        run: bash tools/kafka-fixture.sh stop
      - run: npm run backend:build
      - run: npm run test:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The MongoDB explorer E2E test queries the servers' data.
      - run: npm run e2e
      - name: Stop the MongoDB servers
        if: always()
        run: bash tools/mongo-fixture.sh stop
      - name: Stop the SQL servers
        if: always()
        run: bash tools/sql-fixture.sh stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
