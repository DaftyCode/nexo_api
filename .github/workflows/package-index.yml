name: Update package manager index

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: package-manager-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download published installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --dir .verification/native --pattern '*.msi' --pattern '*.dmg' --pattern '*.deb' --pattern '*.rpm'
      - name: Generate manifests from published binaries
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node tools/package-manifests.mjs --artifacts .verification/native --version "${RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY"
      - name: Update Homebrew tap and WinGet manifests
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p Casks packaging/winget
          cp .verification/packages/Casks/nexo-api.rb Casks/nexo-api.rb
          cp -R .verification/packages/winget/. packaging/winget/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks packaging/winget
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(packages): update installers for $RELEASE_TAG"
          git push origin HEAD:master
