name: Update package manager index

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: package-manager-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - name: Check the release came from Desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not vX.Y.Z. Push a vX.Y.Z tag so 'Desktop packages' builds the installers into a draft release, then publish that draft."
            exit 1
          fi
          installers=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("[.](msi|dmg|deb|rpm)$"))] | length')
          if [ "$installers" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG has no installers. Publish the draft created by 'Desktop packages' instead of a release created by hand."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download published installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --dir .verification/native --pattern '*.msi' --pattern '*.dmg' --pattern '*.deb' --pattern '*.rpm'
      - name: Generate manifests from published binaries
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node tools/package-manifests.mjs --artifacts .verification/native --version "${RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY"
      - name: Update Homebrew tap and WinGet manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p Casks packaging/winget
          cp .verification/packages/Casks/nexo-api.rb Casks/nexo-api.rb
          cp -R .verification/packages/winget/. packaging/winget/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks packaging/winget
          if git diff --cached --quiet; then exit 0; fi
          INDEX_BRANCH="automation/packages-${GITHUB_RUN_ID}"
          git switch -c "$INDEX_BRANCH"
          git commit -m "chore(packages): update installers for $RELEASE_TAG"
          git push origin "HEAD:$INDEX_BRANCH"
          if ! gh pr create --base "$DEFAULT_BRANCH" --head "$INDEX_BRANCH" --title "chore(packages): update installers for $RELEASE_TAG" --body "Updates Homebrew and WinGet manifests from the published installers. Requires maintainer review before merging."; then
            echo "::notice::Automatic PR creation is disabled or unavailable. Open a PR from $INDEX_BRANCH into $DEFAULT_BRANCH. The branch and manifest artifact are ready for owner review."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manager-manifests
          path: .verification/packages
          retention-days: 14
