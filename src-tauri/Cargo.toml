[package]
name = "nexo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
name = "nexo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build.workspace = true
[dependencies]
tauri.workspace = true
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nexo-server = { path = "../backend/crates/nexo-server" }
# Native open and save dialogs for MongoDB imports and exports; GTK on Linux, as Tauri.
# 0.15 is the last one on the gtk 0.18 that Tauri uses.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
